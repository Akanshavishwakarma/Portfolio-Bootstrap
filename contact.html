<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
      <div class="container-fluid px-4">
        <a class="navbar-brand Logo" href="index.html"> Akansha Vishwakarma </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#portfolioNavbar"
          aria-controls="portfolioNavbar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="portfolioNavbar">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="certificates.html">Certificates</a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="projects.html">Projects</a>
            </li>

            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Contact Us</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contact Form -->
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">
          <div class="contact-card">
            <h1 class="section-heading text-center mb-2">Contact Me</h1>

            <p class="text-center text-secondary mb-4">
              Feel free to contact me for opportunities or queries.
            </p>

            <form onsubmit="return validateForm()">
              <!-- Full Name -->
              <div class="mb-3">
                <label for="name" class="form-label"> Full Name </label>

                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="Name"
                  placeholder="Enter your full name"
                />
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label"> Email Address </label>

                <input
                  type="text"
                  class="form-control"
                  id="email"
                  name="Email"
                  placeholder="Enter your email"
                />
              </div>

              <!-- Subject -->
              <div class="mb-3">
                <label for="subject" class="form-label"> Subject </label>

                <input
                  type="text"
                  class="form-control"
                  id="subject"
                  name="Subject"
                  placeholder="Enter subject"
                />
              </div>

              <!-- Message -->
              <div class="mb-3">
                <label for="message" class="form-label"> Message </label>

                <textarea
                  class="form-control"
                  id="message"
                  name="Message"
                  rows="5"
                  placeholder="Write your message"
                ></textarea>
              </div>

              <!-- Validation Message -->
              <p id="result"></p>

              <!-- Submit Button -->
              <button type="submit" class="btn btn-warning w-100 fw-semibold">
                Send Message
              </button>
            </form>

            <!-- Contact Details -->
            <div class="contact-details text-center mt-4">
              <p>
                Email:
                <a href="mailto:akanshav1806@gmail.com">
                  akanshav1806@gmail.com
                </a>
              </p>

              <p>Location: Mumbai, Maharashtra</p>

              <p>
                <a
                  href="https://www.linkedin.com/in/akansha-vishwakarma"
                  target="_blank"
                  rel="noopener"
                  >LinkedIn</a
                >
                |
                <a
                  href="https://github.com/Akanshavishwakarma"
                  target="_blank"
                  rel="noopener"
                  >GitHub</a
                >
              </p>
            </div>
          </div>

          <!-- Back to Home -->
          <div class="text-center mt-4">
            <a href="index.html" class="btn btn-outline-warning">
              Back to Home
            </a>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
      <p>© 2026 Akansha Vishwakarma | Portfolio</p>
    </footer>

    <!-- JavaScript Validation -->
    <script>
      function validateForm() {
        const name = document.getElementById("name").value.trim();

        const email = document.getElementById("email").value.trim();

        const subject = document.getElementById("subject").value.trim();

        const message = document.getElementById("message").value.trim();

        const result = document.getElementById("result");

        result.textContent = "";
        result.style.color = "red";

        // Check empty fields
        if (name === "" || email === "" || subject === "" || message === "") {
          result.textContent = "Please fill out all fields.";

          return false;
        }

        // Validate Name
        const namePattern = /^[a-zA-Z ]+$/;

        if (!namePattern.test(name)) {
          result.textContent = "Please enter a valid name.";

          return false;
        }

        // Validate Email
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
          result.textContent = "Please enter a valid email address.";

          return false;
        }

        // Success Message
        result.style.color = "lightgreen";

        result.textContent = "Form submitted successfully!";

        return false;
      }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
